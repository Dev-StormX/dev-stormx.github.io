<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Mini App - Monetag</title>

  <!-- سكربت Monetag -->
  <script src="https://libtl.com/sdk.js"
          data-zone="10802708"
          data-sdk="show_10802708">
  </script>

  <!-- سكربت Telegram Web App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 50px;
    }
    button {
      padding: 15px 30px;
      font-size: 18px;
      cursor: pointer;
      background-color: #0088cc;
      color: white;
      border: none;
      border-radius: 8px;
    }
    button:active {
      transform: scale(0.98);
    }
    h2 {
      margin-bottom: 20px;
    }
    p {
      margin-bottom: 40px;
      font-size: 16px;
    }
  </style>
</head>
<body>

<h2>🔒 للوصول إلى المحتوى</h2>
<p>يجب مشاهدة الإعلان أولاً قبل المتابعة</p>

<button onclick="start()">📺 مشاهدة الإعلان</button>

<script>
  // تفعيل Telegram WebApp
  const tg = window.Telegram.WebApp;
  tg.expand();

  // 🔥 ضع الرابط النهائي الذي تريد توجيه المستخدم إليه
  const TARGET_URL = "https://example.com"; 

  function start() {
    // التأكد أن الدالة موجودة
    if (typeof show_10802708 !== "function") {
      alert("الإعلان لم يتم تحميله بعد، حاول مرة أخرى");
      return;
    }

    // تشغيل الإعلان Monetag
    show_10802708({ type: "end" })
      .then(() => {
        // بعد مشاهدة الإعلان يتم تحويل المستخدم
        tg.openLink(TARGET_URL, { try_instant_view: false });
      })
      .catch(() => {
        alert("يجب مشاهدة الإعلان أولاً");
      });
  }
</script>

</body>
</html>
