  <!-- Telegram -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

<body style="text-align:center; font-family:sans-serif;">

<h2>🔒 للوصول إلى المحتوى</h2>
<p>يجب مشاهدة الإعلان أولاً</p>

<button onclick="start()">📺 مشاهدة الإعلان</button>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

// 🔥 ضع رابطك هنا
const TARGET_URL = "https://example.com";

function start() {

  // تأكد أن الدالة موجودة
  if (typeof show_10802708 !== "function") {
    alert("Ad not loaded yet");
    return;
  }

  show_10802708().then(() => {
    // ✅ بعد الإعلان
    tg.openLink(TARGET_URL, { try_instant_view: false });
  }).catch(() => {
    alert("يجب مشاهدة الإعلان أولاً");
  });

}
</script>

</body>
</html>
